<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Google Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #fff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-container h1 {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .login-container p {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
      color: #333;
    }
    .google-btn:hover {
      background: #f5f5f5;
      border-color: #4285F4;
      box-shadow: 0 2px 10px rgba(66,133,244,0.2);
    }
    .google-btn img {
      width: 20px;
      height: 20px;
    }
    .user-info {
      display: none;
      text-align: center;
    }
    .user-info img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1rem;
      border: 3px solid #4285F4;
    }
    .user-info h2 {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 0.3rem;
    }
    .user-info p {
      color: #666;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .logout-btn {
      padding: 10px 30px;
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    .logout-btn:hover {
      background: #c82333;
    }
    .error-message {
      color: #dc3545;
      margin-top: 1rem;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Login View -->
    <div id="login-view">
      <h1>Welcome Back</h1>
      <p>Sign in with your Google account to continue</p>
      <button class="google-btn" id="google-signin-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Sign in with Google
      </button>
      <p class="error-message" id="error-message"></p>
    </div>

    <!-- User Profile View (Hidden initially) -->
    <div class="user-info" id="user-info">
      <img id="user-photo" src="" alt="Profile Photo">
      <h2 id="user-name"></h2>
      <p id="user-email"></p>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </div>

  <!-- Main Application Logic -->
  <script type="module">
    import { auth, db, provider } from './firebase.js';
    import { 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // DOM Elements
    const googleSigninBtn = document.getElementById('google-signin-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const loginView = document.getElementById('login-view');
    const userInfoView = document.getElementById('user-info');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');
    const userPhoto = document.getElementById('user-photo');
    const errorMessage = document.getElementById('error-message');

    // --- Function to Store User Data in Firestore ---
    async function storeUserData(user) {
      try {
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        // Only create a new document if it doesn't exist
        if (!userSnap.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            displayName: user.displayName || 'Anonymous',
            email: user.email,
            photoURL: user.photoURL,
            createdAt: new Date().toISOString(),
            lastLogin: new Date().toISOString()
          });
          console.log('User document created in Firestore');
        } else {
          // Update last login time on subsequent logins
          await setDoc(userRef, {
            lastLogin: new Date().toISOString()
          }, { merge: true });
          console.log('User document updated in Firestore');
        }
      } catch (error) {
        console.error('Error storing user data: ', error);
      }
    }

    // --- Google Sign-In Handler ---
    googleSigninBtn.addEventListener('click', async () => {
      try {
        errorMessage.style.display = 'none';
        const result = await signInWithPopup(auth, provider);
        
        // The signed-in user info
        const user = result.user;
        
        // Store/Update user data in Firestore
        await storeUserData(user);
        
      } catch (error) {
        // Handle specific errors
        console.error('Login error:', error);
        if (error.code === 'auth/popup-blocked') {
          errorMessage.textContent = 'Popup was blocked. Please allow popups for this site and try again.';
        } else if (error.code === 'auth/popup-closed-by-user') {
          errorMessage.textContent = 'Sign-in popup was closed. Please try again.';
        } else if (error.code === 'auth/unauthorized-domain') {
          errorMessage.textContent = 'This domain is not authorized. Please check your Firebase settings.';
        } else {
          errorMessage.textContent = `Error: ${error.message}`;
        }
        errorMessage.style.display = 'block';
      }
    });

    // --- Logout Handler ---
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error('Logout error:', error);
      }
    });

    // --- Auth State Observer ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User is signed in
        console.log('User is signed in:', user);
        
        // Update UI
        userName.textContent = user.displayName || 'User';
        userEmail.textContent = user.email;
        userPhoto.src = user.photoURL || 'https://via.placeholder.com/80';
        
        loginView.style.display = 'none';
        userInfoView.style.display = 'block';
      } else {
        // User is signed out
        console.log('User is signed out');
        
        // Update UI
        loginView.style.display = 'block';
        userInfoView.style.display = 'none';
      }
    });
  </script>
</body>
</html>
