<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Admin Panel — Store Manager</title>
<style>
:root{--clr-primary:#2563eb;--clr-primary-dark:#1d4ed8;--clr-primary-light:#dbeafe;--clr-success:#16a34a;--clr-success-light:#dcfce7;--clr-warning:#f59e0b;--clr-warning-light:#fef3c7;--clr-danger:#dc2626;--clr-danger-light:#fee2e2;--clr-purple:#7c3aed;--clr-purple-light:#ede9fe;--clr-teal:#0d9488;--clr-orange:#ea580c;--clr-bg:#f1f5f9;--clr-surface:#fff;--clr-border:#e2e8f0;--clr-text:#0f172a;--clr-text-muted:#64748b;--clr-text-light:#94a3b8;--radius-sm:6px;--radius:10px;--radius-lg:16px;--radius-full:9999px;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);--font:'Segoe UI',system-ui,-apple-system,sans-serif;--transition:.2s ease;--header-h:60px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--clr-bg);color:var(--clr-text);line-height:1.5;min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit}
a{color:var(--clr-primary);text-decoration:none}
.hidden{display:none!important}
.text-center{text-align:center}.text-muted{color:var(--clr-text-muted)}.text-sm{font-size:.875rem}.text-xs{font-size:.75rem}
.fw-600{font-weight:600}.fw-700{font-weight:700}
.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:1rem}.mt-4{margin-top:1.5rem}
.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:1rem}.mb-4{margin-bottom:1.5rem}
.gap-2{gap:.5rem}.gap-3{gap:1rem}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.2rem;border:none;border-radius:var(--radius);font-weight:600;font-size:.875rem;cursor:pointer;transition:all var(--transition);white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--clr-primary);color:#fff}.btn-primary:hover{background:var(--clr-primary-dark)}
.btn-danger{background:var(--clr-danger);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--clr-border);color:var(--clr-text)}
.btn-outline:hover{border-color:var(--clr-primary);color:var(--clr-primary)}
.btn-google{background:#fff;border:1.5px solid var(--clr-border);color:#3c4043;font-weight:600;display:flex;align-items:center;justify-content:center;gap:.6rem}
.btn-google:hover{background:#f8f9fa;border-color:#dadce0}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
.btn-xs{padding:.25rem .5rem;font-size:.75rem;border-radius:var(--radius-sm)}
.btn-block{width:100%}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:.35rem}
.form-control{width:100%;padding:.65rem .85rem;border:1.5px solid var(--clr-border);border-radius:var(--radius);font-size:.9rem;background:var(--clr-surface);color:var(--clr-text);transition:border-color var(--transition),box-shadow var(--transition)}
.form-control:focus{outline:none;border-color:var(--clr-primary);box-shadow:0 0 0 3px var(--clr-primary-light)}
textarea.form-control{resize:vertical;min-height:80px}
select.form-control{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.card{background:var(--clr-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:1.25rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.card-title{font-size:1.1rem;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--clr-surface);border-radius:var(--radius-lg);padding:1rem;box-shadow:var(--shadow);border-left:4px solid var(--clr-primary);transition:transform var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card .stat-value{font-size:1.75rem;font-weight:800;line-height:1.2}
.stat-card .stat-label{font-size:.78rem;color:var(--clr-text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat-card .stat-icon{font-size:1.5rem;margin-bottom:.3rem}
.stat-card.blue{border-left-color:var(--clr-primary)}.stat-card.green{border-left-color:var(--clr-success)}.stat-card.yellow{border-left-color:var(--clr-warning)}.stat-card.red{border-left-color:var(--clr-danger)}.stat-card.purple{border-left-color:var(--clr-purple)}.stat-card.teal{border-left-color:var(--clr-teal)}.stat-card.orange{border-left-color:var(--clr-orange)}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:var(--radius-full);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-active{background:var(--clr-success-light);color:#166534}
.badge-inactive{background:var(--clr-danger-light);color:var(--clr-danger)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{padding:.75rem .6rem;text-align:left;border-bottom:1px solid var(--clr-border);white-space:nowrap}
th{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--clr-text-muted);background:#f8fafc}
tr:hover td{background:#f8fafc}
.table-img{width:40px;height:40px;border-radius:var(--radius-sm);object-fit:cover}
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:.5rem;max-width:360px;width:calc(100% - 32px)}
.toast{padding:.75rem 1rem;border-radius:var(--radius);color:#fff;font-weight:600;font-size:.875rem;box-shadow:var(--shadow-lg);animation:toastIn .3s ease;word-break:break-word}
.toast.success{background:var(--clr-success)}.toast.error{background:var(--clr-danger)}.toast.info{background:var(--clr-primary)}.toast.warning{background:var(--clr-warning)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--clr-surface);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalUp .3s ease}
@keyframes modalUp{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem;border-bottom:1px solid var(--clr-border);position:sticky;top:0;background:var(--clr-surface);z-index:1}
.modal-header h3{font-size:1.1rem}
.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--clr-text-muted);padding:.2rem .5rem;border-radius:var(--radius-sm)}
.modal-body{padding:1.25rem}
.spinner{width:40px;height:40px;border:4px solid var(--clr-border);border-top-color:var(--clr-primary);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--clr-text-muted)}
.empty-state .icon{font-size:3rem;margin-bottom:.5rem}
.app-header{background:var(--clr-surface);border-bottom:1px solid var(--clr-border);position:sticky;top:0;z-index:100;height:var(--header-h);box-shadow:var(--shadow-sm)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 1rem;height:100%;display:flex;align-items:center;gap:1rem}
.logo{font-size:1.2rem;font-weight:800;color:var(--clr-primary);white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.logo span{color:var(--clr-text)}
.header-actions{display:flex;align-items:center;gap:.3rem;margin-left:auto}
.header-btn{background:none;border:none;cursor:pointer;padding:.5rem .6rem;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--clr-text);font-weight:600}
.header-btn:hover{background:var(--clr-bg)}
.header-btn .icon{font-size:1.15rem}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(135deg,#eff6ff 0%,#f1f5f9 100%)}
.login-card{background:var(--clr-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:2rem;width:100%;max-width:400px}
.login-card .logo{justify-content:center;margin-bottom:1.5rem;font-size:1.5rem}
.login-card h2{text-align:center;margin-bottom:.25rem}
.login-card .subtitle{text-align:center;color:var(--clr-text-muted);font-size:.875rem;margin-bottom:1.5rem}
.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--clr-text-light);font-size:.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--clr-border)}
.page-container{max-width:1280px;margin:0 auto;padding:1rem}
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-bar .form-control{width:auto;min-width:160px;flex:1;max-width:280px}
.img-preview-grid{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.img-preview-item{position:relative;width:72px;height:72px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--clr-border)}
.img-preview-item img{width:100%;height:100%;object-fit:cover}
.img-preview-item .remove-img{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
@media(max-width:767px){.page-container{padding:.75rem}.stats-grid{grid-template-columns:repeat(2,1fr);gap:.6rem}.stat-card .stat-value{font-size:1.3rem}.filter-bar .form-control{max-width:100%;min-width:0}.hidden-mobile{display:none}}
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="logo">🛒 <span>Store</span>Admin</div>
    <h2>Admin Login</h2>
    <p class="subtitle">Sign in to manage your products</p>

    <button type="button" class="btn btn-google btn-block" id="google-login-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.1 0 9.7-2 13.1-5.1l-6.1-5.2C29.1 34.8 26.7 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.8 39.2 16.4 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.1 5.2c-.4.4 6.7-4.9 6.7-14.6 0-1.2-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>

    <div class="divider">or sign in with email</div>

    <form id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-control" required autocomplete="email"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" class="form-control" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-block mt-3" id="login-btn">Sign In</button>
      <p id="login-error" class="text-center text-sm mt-2" style="color:var(--clr-danger)"></p>
    </form>
  </div>
</div>

<div id="admin-panel" class="hidden">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">🛒 <span>Store</span>Admin</div>
      <div class="header-actions">
        <span id="admin-email" class="text-sm text-muted hidden-mobile" style="margin-right:.5rem"></span>
        <button class="header-btn" id="logout-btn"><span class="icon">🚪</span><span>Logout</span></button>
      </div>
    </div>
  </header>
  <main class="page-container">
    <div class="stats-grid">
      <div class="stat-card blue"><div class="stat-icon">📦</div><div class="stat-value" id="stat-total-products">0</div><div class="stat-label">Total Products</div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-value" id="stat-active-products">0</div><div class="stat-label">Active Products</div></div>
      <div class="stat-card purple"><div class="stat-icon">🛍️</div><div class="stat-value" id="stat-total-orders">0</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card yellow"><div class="stat-icon">⏳</div><div class="stat-value" id="stat-pending-orders">0</div><div class="stat-label">Pending</div></div>
      <div class="stat-card orange"><div class="stat-icon">🔄</div><div class="stat-value" id="stat-processing-orders">0</div><div class="stat-label">Processing</div></div>
      <div class="stat-card teal"><div class="stat-icon">💰</div><div class="stat-value" id="stat-total-sales">₹0</div><div class="stat-label">Total Sales</div></div>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h3 class="card-title" id="form-title">➕ Add New Product</h3>
        <button class="btn btn-outline btn-sm" id="reset-form-btn">Reset</button>
      </div>
      <form id="product-form">
        <div class="form-row">
          <div class="form-group"><label>Product Name *</label><input type="text" id="p-name" class="form-control" required></div>
          <div class="form-group"><label>SKU *</label><input type="text" id="p-sku" class="form-control" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Category *</label><input type="text" id="p-category" class="form-control" list="category-list" required><datalist id="category-list"></datalist></div>
          <div class="form-group"><label>Brand</label><input type="text" id="p-brand" class="form-control"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Price (₹) *</label><input type="number" id="p-price" class="form-control" min="0" step="0.01" required></div>
          <div class="form-group"><label>Discount Price (₹)</label><input type="number" id="p-discount-price" class="form-control" min="0" step="0.01"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Stock *</label><input type="number" id="p-stock" class="form-control" min="0" required></div>
          <div class="form-group"><label>Status</label>
            <select id="p-status" class="form-control"><option value="active">Active</option><option value="inactive">Inactive</option></select>
          </div>
        </div>
        <div class="form-group"><label>Description</label><textarea id="p-description" class="form-control" rows="3"></textarea></div>
        <div class="form-group"><label>Specifications</label><textarea id="p-specifications" class="form-control" rows="3"></textarea></div>
        <div class="form-group"><label>Product Images</label><input type="file" id="p-images" class="form-control" accept="image/*" multiple><div class="img-preview-grid" id="img-preview"></div></div>
        <button type="submit" class="btn btn-primary btn-block mt-2" id="submit-product-btn">💾 Save Product</button>
      </form>
    </div>

    <div class="card">
      <div class="card-header"><h3 class="card-title">📋 Product Management</h3></div>
      <div class="filter-bar">
        <input type="text" id="product-search" class="form-control" placeholder="🔍 Search...">
        <select id="category-filter" class="form-control"><option value="">All Categories</option></select>
      </div>
      <div id="product-list"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYo85hjmMHIUkaALQco2zZvLGNB4qnn6w",
  authDomain: "login-ec269.firebaseapp.com",
  databaseURL: "https://login-ec269-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "login-ec269",
  storageBucket: "login-ec269.firebasestorage.app",
  messagingSenderId: "105803973773",
  appId: "1:105803973773:web:d04142810a7eba2acd4ec4",
  measurementId: "G-DY05C5324Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

const $ = (s) => document.querySelector(s);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };

let allProducts = [];
let selectedImages = [];
let editingProductId = null;
let unsubProducts = null;
let unsubOrders = null;

function showToast(msg, type = 'info') {
  const c = $('#toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.animation = 'toastOut .3s ease forwards'; setTimeout(() => t.remove(), 300); }, 5000);
}

function confirmAction(msg) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal" style="max-width:400px"><div class="modal-body text-center"><p style="font-size:1.1rem;font-weight:600;margin-bottom:1rem">${msg}</p><div style="display:flex;gap:.5rem;justify-content:center"><button class="btn btn-outline" data-a="c">Cancel</button><button class="btn btn-danger" data-a="k">Confirm</button></div></div></div>`;
    ov.querySelector('[data-a="c"]').onclick = () => { ov.remove(); resolve(false); };
    ov.querySelector('[data-a="k"]').onclick = () => { ov.remove(); resolve(true); };
    document.body.appendChild(ov);
  });
}

async function signInWithGoogle() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    // Create user doc if it doesn't exist (as a customer by default)
    const userRef = doc(db, 'users', user.uid);
    const userSnap = await getDoc(userRef);
    if (!userSnap.exists()) {
      await setDoc(userRef, {
        uid: user.uid, email: user.email, name: user.displayName || '',
        photoURL: user.photoURL || '', role: 'customer', createdAt: serverTimestamp()
      });
      showToast('Account created as customer. Ask admin for admin role.', 'warning');
      await signOut(auth);
    }
  } catch (err) {
    console.error('Google sign-in error:', err.code, err.message);
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/unauthorized-domain') return showToast('Domain not authorized. Add this domain in Firebase Console.', 'error');
    if (err.code === 'auth/operation-not-allowed') return showToast('Google sign-in is not enabled in Firebase Console.', 'error');
    showToast('Google sign-in failed: ' + err.message, 'error');
  }
}

$('#google-login-btn').addEventListener('click', signInWithGoogle);

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#login-error').textContent = '';
  const btn = $('#login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await signInWithEmailAndPassword(auth, $('#login-email').value.trim(), $('#login-password').value);
  } catch (err) {
    $('#login-error').textContent = err.code === 'auth/invalid-credential' ? 'Invalid email or password.' : err.message;
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
});

$('#logout-btn').addEventListener('click', async () => {
  if (await confirmAction('Are you sure you want to logout?')) await signOut(auth);
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    try {
      const uDoc = await getDoc(doc(db, 'users', user.uid));
      const role = uDoc.exists() ? uDoc.data().role : null;
      if (role !== 'admin') {
        showToast('Access denied. Admin role required. Please set role to "admin" in Firestore.', 'error');
        await signOut(auth);
        return;
      }
    } catch (err) { 
      console.error('Firestore error:', err);
      showToast('Database connection failed. Have you created Firestore Database in Firebase?', 'error');
      return; // Don't log out, let user retry
    }
    $('#login-screen').classList.add('hidden');
    $('#admin-panel').classList.remove('hidden');
    $('#admin-email').textContent = user.email;
    listenProducts(); listenOrders();
  } else {
    $('#login-screen').classList.remove('hidden');
    $('#admin-panel').classList.add('hidden');
    if (unsubProducts) { unsubProducts(); unsubProducts = null; }
    if (unsubOrders) { unsubOrders(); unsubOrders = null; }
  }
});

function listenProducts() {
  if (unsubProducts) unsubProducts();
  const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
  unsubProducts = onSnapshot(q, (snap) => {
    allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateProductStats(); populateCategoryFilter(); renderProductList();
  }, () => {
    onSnapshot(query(collection(db, 'products')), (snap) => {
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateProductStats(); populateCategoryFilter(); renderProductList();
    });
  });
}

function listenOrders() {
  if (unsubOrders) unsubOrders();
  unsubOrders = onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc')), (snap) => {
    updateOrderStats(snap.docs.map(d => d.data()));
  }, () => {});
}

function updateProductStats() {
  $('#stat-total-products').textContent = allProducts.length;
  $('#stat-active-products').textContent = allProducts.filter(p => p.status === 'active').length;
}

function updateOrderStats(orders) {
  $('#stat-total-orders').textContent = orders.length;
  $('#stat-pending-orders').textContent = orders.filter(o => ['NEW', 'CONFIRMED'].includes(o.orderStatus)).length;
  $('#stat-processing-orders').textContent = orders.filter(o => ['PICKING', 'PACKED', 'READY TO SHIP', 'SHIPPED', 'OUT FOR DELIVERY'].includes(o.orderStatus)).length;
  const sales = orders.filter(o => !['CANCELLED', 'RETURNED'].includes(o.orderStatus)).reduce((s, o) => s + (o.totalAmount || 0), 0);
  $('#stat-total-sales').textContent = '₹' + sales.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

$('#p-images').addEventListener('change', (e) => {
  Array.from(e.target.files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (ev) => { selectedImages.push({ file, dataUrl: ev.target.result }); renderPreviews(); };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

function renderPreviews() {
  const el = $('#img-preview');
  el.innerHTML = '';
  selectedImages.forEach((img, i) => {
    const d = document.createElement('div');
    d.className = 'img-preview-item';
    d.innerHTML = `<img src="${img.dataUrl}"><button type="button" class="remove-img" data-i="${i}">&times;</button>`;
    d.querySelector('.remove-img').onclick = () => { selectedImages.splice(i, 1); renderPreviews(); };
    el.appendChild(d);
  });
}

$('#product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#submit-product-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const name = $('#p-name').value.trim();
    const sku = $('#p-sku').value.trim().toUpperCase();
    const category = $('#p-category').value.trim();
    const brand = $('#p-brand').value.trim();
    const price = parseFloat($('#p-price').value);
    const discountPrice = $('#p-discount-price').value ? parseFloat($('#p-discount-price').value) : null;
    const stock = parseInt($('#p-stock').value) || 0;
    const status = $('#p-status').value;
    const description = $('#p-description').value.trim();
    const specifications = $('#p-specifications').value.trim();
    const productId = editingProductId || doc(collection(db, 'products')).id;

    const imageUrls = [];
    for (const img of selectedImages) {
      if (img.url) { imageUrls.push(img.url); continue; }
      const sRef = ref(storage, `products/${productId}/${Date.now()}_${img.file.name}`);
      const snap = await uploadBytesResumable(sRef, img.file);
      imageUrls.push(await getDownloadURL(snap.ref));
    }

    const data = { productId, name, sku, category, brand, price, discountPrice, stock, status, description, specifications, images: imageUrls, updatedAt: serverTimestamp() };
    if (editingProductId) {
      await updateDoc(doc(db, 'products', productId), data);
      showToast('Product updated!', 'success');
    } else {
      data.createdAt = serverTimestamp();
      await setDoc(doc(db, 'products', productId), data);
      showToast('Product added!', 'success');
    }
    resetForm();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = editingProductId ? '💾 Update Product' : '💾 Save Product'; }
});

function resetForm() {
  $('#product-form').reset();
  editingProductId = null;
  selectedImages = [];
  $('#img-preview').innerHTML = '';
  $('#form-title').textContent = '➕ Add New Product';
  $('#submit-product-btn').textContent = '💾 Save Product';
}

$('#reset-form-btn').addEventListener('click', resetForm);

function populateCategoryFilter() {
  const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
  const cur = $('#category-filter').value;
  $('#category-filter').innerHTML = '<option value="">All Categories</option>' + cats.map(c => `<option value="${c}"${c === cur ? ' selected' : ''}>${c}</option>`).join('');
  $('#category-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');
}

function renderProductList() {
  const s = $('#product-search').value.toLowerCase();
  const cat = $('#category-filter').value;
  let filtered = allProducts;
  if (s) filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(s) || (p.sku || '').toLowerCase().includes(s) || (p.brand || '').toLowerCase().includes(s));
  if (cat) filtered = filtered.filter(p => p.category === cat);

  const el = $('#product-list');
  if (!filtered.length) { el.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>No products found.</p></div>`; return; }
  el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${filtered.map(p => `<tr>
      <td><img class="table-img" src="${p.images?.[0] || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect fill=%22%23e2e8f0%22 width=%2240%22 height=%2240%22/%3E%3C/svg%3E'}" alt=""></td>
      <td><span class="fw-600">${esc(p.name)}</span><br><span class="text-xs text-muted">${esc(p.brand || '')}</span></td>
      <td class="text-sm">${esc(p.sku)}</td>
      <td class="text-sm">${esc(p.category || '—')}</td>
      <td class="fw-600">₹${p.discountPrice || p.price}</td>
      <td><span style="font-weight:600;color:${p.stock > 0 ? 'var(--clr-success)' : 'var(--clr-danger)'}">${p.stock}</span></td>
      <td><span class="badge badge-${p.status === 'active' ? 'active' : 'inactive'}">${p.status}</span></td>
      <td>
        <button class="btn btn-xs btn-outline" onclick="window.editProduct('${p.id}')">✏️</button>
        <button class="btn btn-xs btn-danger" onclick="window.deleteProduct('${p.id}','${esc(p.name).replace(/'/g, '&#39;')}')">🗑️</button>
      </td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

window.editProduct = (id) => {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  editingProductId = id;
  $('#p-name').value = p.name || '';
  $('#p-sku').value = p.sku || '';
  $('#p-category').value = p.category || '';
  $('#p-brand').value = p.brand || '';
  $('#p-price').value = p.price || '';
  $('#p-discount-price').value = p.discountPrice || '';
  $('#p-stock').value = p.stock || 0;
  $('#p-status').value = p.status || 'active';
  $('#p-description').value = p.description || '';
  $('#p-specifications').value = p.specifications || '';
  selectedImages = (p.images || []).map(url => ({ url, dataUrl: url }));
  renderPreviews();
  $('#form-title').textContent = '✏️ Edit Product';
  $('#submit-product-btn').textContent = '💾 Update Product';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteProduct = async (id, name) => {
  if (!(await confirmAction(`Delete "${name}"? Cannot be undone.`))) return;
  try {
    const p = allProducts.find(x => x.id === id);
    if (p?.images) for (const url of p.images) { try { await deleteObject(ref(storage, url)); } catch {} }
    await deleteDoc(doc(db, 'products', id));
    showToast('Product deleted.', 'success');
  } catch (err) { showToast('Delete failed: ' + err.message, 'error'); }
};

$('#product-search').addEventListener('input', renderProductList);
$('#category-filter').addEventListener('change', renderProductList);
</script>
</body>
</html>
